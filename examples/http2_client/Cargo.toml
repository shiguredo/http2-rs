[package]
name = "http2_client"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# HTTP/1.1 URI パース
shiguredo_http11 = "2026.6"
# 非同期ランタイム
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
# tokio 統合 HTTP/2
tokio-http2 = { path = "../../crates/tokio-http2" }
