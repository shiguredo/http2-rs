[package]
name = "http2_server"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# 自己署名証明書生成
rcgen = "0.14"
# 証明書の DER 型
rustls-pki-types = "1.15"
# 非同期ランタイム
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
# tokio 統合 HTTP/2
tokio-http2 = { path = "../../crates/tokio-http2" }
