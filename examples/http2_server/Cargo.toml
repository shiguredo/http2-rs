[package]
name = "http2_server"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
tokio-http2 = { path = "../../crates/tokio-http2" }
# レスポンスボディを Bytes で渡すために使用する
bytes = { version = "1.11", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rustls-pki-types = "1"
rcgen = "0.14"
