[package]
name = "tokio-nghttp2"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
rustls = {
  version = "0.23",
  default-features = false,
  features = [
    "aws_lc_rs",
    "std",
    "tls12",
  ]
}
rustls-pki-types = { version = "1.15", features = ["std"] }
rustls-platform-verifier = "0.7"
shiguredo_nghttp2 = { path = "../shiguredo_nghttp2" }
tokio = {
  version = "1.53",
  features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "sync",
    "time",
  ]
}
tokio-rustls = "0.26"

[dev-dependencies]
rcgen = "0.14"
tokio = { version = "1.53", features = ["full"] }
