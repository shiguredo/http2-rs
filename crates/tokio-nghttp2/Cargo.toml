[package]
name = "tokio-nghttp2"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# TLS
rustls = {
  version = "0.23",
  default-features = false,
  features = [
    "aws_lc_rs",
    "std",
    "tls12",
  ]
}
# 証明書の DER 型
rustls-pki-types = { version = "1.15", features = ["std"] }
# システム信頼ストア検証
rustls-platform-verifier = "0.7"
# nghttp2 Sans I/O バインディング
shiguredo_nghttp2 = { path = "../shiguredo_nghttp2" }
# 非同期ランタイム
tokio = {
  version = "1.53",
  features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "sync",
    "time",
  ]
}
# TLS ストリームの tokio 統合
tokio-rustls = "0.26"

[dev-dependencies]
# 自己署名証明書生成
rcgen = "0.14"
# テスト用非同期ランタイム
tokio = { version = "1.53", features = ["full"] }
