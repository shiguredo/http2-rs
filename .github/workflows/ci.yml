name: CI

on:
  schedule:
    # JST 11:00 (UTC 02:00), 月-金
    - cron: "0 2 * * 1-5"
  # 追加した検証を手動で実行して確認するために使う
  workflow_dispatch:

jobs:
  ci:
    name: CI
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          # windows はテストに時間がかかりすぎるため一時的に除外する
          # - windows-2025
          - macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable
      - uses: shiguredo/github-actions/.github/actions/rust-cache@main
        with:
          os: ${{ matrix.os }}
          toolchain: stable
      - run: cargo fmt --all --check
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings
      - name: Check fuzz crate
        if: matrix.os == 'ubuntu-24.04'
        run: cargo check --manifest-path fuzz/Cargo.toml
      # 実ブラウザ (WebKit) から wt_server へ WebTransport over HTTP/2 で接続できることを確認する。
      # ブラウザは macOS でのみ導入できるため macOS でのみ実行する。
      - name: Set up Node.js
        if: runner.os == 'macOS'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install Playwright browsers
        if: runner.os == 'macOS'
        run: |
          npm ci --prefix interop/browser
          npx --prefix interop/browser playwright install webkit
      - name: Build WebTransport server
        if: runner.os == 'macOS'
        run: cargo build -p wt_server
      - name: Run browser WebTransport interop tests
        if: runner.os == 'macOS'
        run: node interop/browser/run.mjs
        env:
          # Playwright 未導入を失敗として扱う (skip で CI が緑になるのを防ぐ)
          WT_FORCE: "1"

  slack_notify:
    needs: [ci]
    runs-on: ubuntu-slim
    if: ${{ always() }}
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_channel: sora-moqt
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}
