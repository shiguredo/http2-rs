[package]
name = "shiguredo_http2"
version = "2026.1.0-canary.2"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Sans I/O HTTP/2 Library"
homepage = "https://github.com/shiguredo/http2-rs"
repository = "https://github.com/shiguredo/http2-rs"
readme = "README.md"
include = ["/src/**", "LICENSE", "README.md"]

[dependencies]

[features]
# テスト専用ヘルパを公開する (PBT/fuzz 専用、本番利用禁止)
# 構築時検査をバイパスする HeaderField::from_validated_parts などを
# 外部 crate から呼び出せるようにする。型不変条件を破壊するため
# 通常の利用者は有効化してはならない。
__test_helpers = []

[workspace]
members = [
    "examples/http2_client",
    "examples/http2_server",
    "examples/wt_server",
    "pbt",
    "crates/nghttp2-sys",
    "crates/shiguredo_nghttp2",
    "crates/tokio-nghttp2",
    "crates/tokio-http2",
]
exclude = ["fuzz"]
