[package]
name = "shiguredo_http2"
version = "2026.1.0-canary.3"
edition.workspace = true
rust-version.workspace = true
description = "Sans I/O HTTP/2 Library"
readme = "README.md"
homepage = "https://github.com/shiguredo/http2-rs"
repository = "https://github.com/shiguredo/http2-rs"
license = "Apache-2.0"
include = ["/src/**", "LICENSE", "README.md"]

[workspace]
members = [
  "crates/nghttp2-sys",
  "crates/shiguredo_nghttp2",
  "crates/tokio-http2",
  "crates/tokio-nghttp2",
  "examples/http2_client",
  "examples/http2_server",
  "examples/wt_server",
  "pbt",
]
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.88"

[dependencies]

[dev-dependencies]
# PBT: const fn / runtime 検査の同値性検証
proptest = "1.11"
